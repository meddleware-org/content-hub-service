# Licences accepted for crates linked into the `content-hub` binary. A dependency under any other
# licence fails the image build and CI (`cargo about generate --fail`): review it, then add it here
# deliberately (and to deny.toml).
# The licences, by SPDX identifier.
accepted = [
    "0BSD",
    "Apache-2.0",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
# Only the two architectures the image is built for are considered, so a crate used by another target is not listed.
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]
# Build-time and test-time crates do not end up in the binary, so they are not part of its notices.
ignore-build-dependencies = true
ignore-dev-dependencies = true
# `ring` carries a mix of licence texts that need cargo-about's built-in workaround to be recognised.
workarounds = ["ring"]
