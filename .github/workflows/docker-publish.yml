name: Publish (Docker)
# Release pipeline for content-hub-service. Fires on version tags (v*); `workflow_dispatch` is a DRY RUN.
#
# Supply-chain controls (verifiable by any anonymous operator):
#   - Multi-arch image (linux/amd64, linux/arm64), each architecture compiled on its own NATIVE runner
#     (ubuntu-latest, ubuntu-24.04-arm; a Rust release build under QEMU took ~1.5 h), merged into one index
#   - SBOMs attested with cosign: the image (SPDX, syft) and each binary's crates (CycloneDX,
#     cargo-cyclonedx, checked against Cargo.lock by scripts/check-sbom.sh); SLSA provenance by BuildKit
#     (one per architecture, kept in the merged index; scripts/check-index.sh asserts it)
#   - Keyless cosign signatures (Sigstore Fulcio/Rekor) over the merged index digest, after the Trivy scan
#   - GitHub-native build-provenance attestation
#   - `latest` is published ONLY for stable (non-pre-release) semver tags
#
# Job graph: version, verify (CI checks), sbom-crates -> build (amd64 + arm64, OCI archives, NO registry
# credentials) -> publish-arch (pushes <sha>-<arch>) -> merge-docker-public (imagetools create, Trivy scan by
# digest, sign, attest) -> mirror-private. The <sha>-<arch> tags are build intermediates, never releases:
# deploy by the signed index digest (docs/images/IMAGES.md in the workspace).
#
# Dry run: Actions -> "Publish (Docker)" -> Run workflow (dry_run defaults to true). It builds both
# architectures natively, then merges and scans them in a throwaway registry on the runner. Nothing is
# pushed to quay.io or Docker Hub, nothing is signed, no secret is read.
#
# Public registries (quay.io, Docker Hub) get the full treatment. The self-hosted
# registry receives the SAME published image by digest (cosign copy, never a rebuild; the
# `mirror-private` job is best-effort, continue-on-error, since it may not be configured yet).
#
# Required repository configuration:
#   Secrets: QUAY_USERNAME/QUAY_TOKEN, DOCKERHUB_USERNAME/DOCKERHUB_TOKEN,
#            PRIVATE_REGISTRY_USERNAME/PRIVATE_REGISTRY_TOKEN
#   Vars (optional overrides): QUAY_NAMESPACE, DOCKERHUB_NAMESPACE,
#            PRIVATE_REGISTRY, PRIVATE_NAMESPACE, VENDOR, DESCRIPTION,
#            SOURCE_URL, DOCUMENTATION_URL, IMAGE_URL

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: build both architectures, merge and scan in a throwaway registry; publish nothing"
        type: boolean
        default: true

env:
  IMAGE: content-hub-service

permissions:
  contents: read

jobs:
  version:
    name: Tag matches the Cargo workspace version
    runs-on: ubuntu-latest
    outputs:
      dry_run: ${{ steps.mode.outputs.dry_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A tag push publishes. A manual run publishes only when dry_run is switched off AND it runs on a v* tag,
      # so a release is always signed by a refs/tags/v* identity (what every verifier requires).
      - name: Mode
        id: mode
        env:
          EVENT: ${{ github.event_name }}
          DRY: ${{ inputs.dry_run }}
          REF: ${{ github.ref }}
        run: |
          if [ "${EVENT}" = workflow_dispatch ] && [ "${DRY}" = true ]; then
            echo "dry_run=true" >> "$GITHUB_OUTPUT"
            echo "Dry run: nothing is pushed or signed." >> "$GITHUB_STEP_SUMMARY"
          else
            case "${REF}" in
              refs/tags/v*) ;;
              *) echo "::error::publishing needs a v* tag (got ${REF}); run with dry_run on a branch"; exit 1 ;;
            esac
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compare
        if: steps.mode.outputs.dry_run != 'true'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="$(cargo metadata --no-deps --locked --format-version 1 | jq -r '.packages[] | select(.name == "content-hub") | .version')"
          if [ "${TAG#v}" != "$VERSION" ]; then
            echo "::error::tag ${TAG} does not match the Cargo workspace version ${VERSION}"
            exit 1
          fi

  # The release runs exactly what CI runs (fmt, clippy, tests, cargo-deny, the SBOM gate, MSRV, the client
  # contract, licence notices, configuration and image scans, the two-binary smoke test) on the tagged
  # commit, so no check can be skipped by tagging.
  verify:
    name: Verify (CI checks)
    uses: ./.github/workflows/rust-ci.yml

  # The CycloneDX SBOM of the binary's crates. It needs only the sources, so it runs beside the builds.
  # Two SBOMs are attested to the image digest in all:
  #   1. the published image (SPDX, syft): the distroless base, plus the crates syft reads from the
  #      /app/Cargo.lock it ships (generated in the merge job, from the merged image);
  #   2. the crates linked into /app/content-hub (CycloneDX, cargo-cyclonedx, build and dev dependencies
  #      excluded), checked against the Cargo.lock dependency graph by scripts/check-sbom.sh, so a missing
  #      crate stops the release.
  # `cosign verify-attestation --type spdxjson` returns the first, `--type cyclonedx` the second.
  sbom-crates:
    name: SBOM of the binary
    needs: [version, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install cargo-cyclonedx
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-cyclonedx@0.5.9

      - name: Generate the SBOMs of the two binaries
        run: |
          cargo cyclonedx --manifest-path crates/cli/Cargo.toml --format json --spec-version 1.5 \
            --no-build-deps --target x86_64-unknown-linux-gnu -q
          cp crates/cli/content-hub.cdx.json sbom.content-hub.cdx.json
          bash scripts/check-sbom.sh sbom.content-hub.cdx.json content-hub

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-crates
          path: |
            sbom.content-hub.cdx.json
          retention-days: 1
          if-no-files-found: error

  # Each architecture is compiled on a native runner. The build holds no registry credentials (it compiles
  # hundreds of third-party crates, build scripts included): it exports an OCI archive, and publish-arch
  # logs in only to push it. The same metadata-action config as the merge job (images, tags, flavor) gives
  # the labels and the VERSION build argument, so the published labels are what a single build produced.
  build:
    name: Build ${{ matrix.arch }}
    needs: [version, verify]
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            # Native runner per architecture: a Rust release build under QEMU took ~1.5 h.
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Compute labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            quay.io/${{ vars.QUAY_NAMESPACE || 'meddleware-org' }}/${{ env.IMAGE }}
            docker.io/${{ vars.DOCKERHUB_NAMESPACE || 'meddleware' }}/${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=dry-run,enable=${{ needs.version.outputs.dry_run == 'true' }}
          flavor: |
            latest=auto

      - name: Build (OCI archive, not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          outputs: type=oci,dest=${{ runner.temp }}/${{ matrix.arch }}.tar
          labels: ${{ steps.meta.outputs.labels }}
          # The layer cache helps a re-run of a failed release (the cache is scoped to the tag's ref).
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.arch }},mode=max
          # BuildKit SBOM pulls docker/buildkit-syft-scanner from Docker Hub, whose
          # anonymous OAuth endpoint is unreliable (connection resets). Provenance
          # + cosign signatures + actions/attest-build-provenance already cover
          # supply-chain attestation, matching the split-arch image repos.
          sbom: false
          provenance: mode=max
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            VENDOR=${{ vars.VENDOR || 'Meddleware' }}
            DESCRIPTION=${{ vars.DESCRIPTION || 'Content hub: canonical posts, roadmap and publishing queue (admin, public, worker).' }}
            SOURCE_URL=${{ vars.SOURCE_URL || 'https://github.com/meddleware-org/content-hub-service' }}
            DOCUMENTATION_URL=${{ vars.DOCUMENTATION_URL || 'https://github.com/meddleware-org/content-hub-service#readme' }}
            IMAGE_URL=${{ vars.IMAGE_URL || 'https://quay.io/meddleware-org/content-hub-service' }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oci-${{ matrix.arch }}
          path: ${{ runner.temp }}/${{ matrix.arch }}.tar
          retention-days: 1
          if-no-files-found: error

  publish-arch:
    name: Push ${{ matrix.arch }} (quay.io + Docker Hub)
    needs: [version, build]
    if: needs.version.outputs.dry_run != 'true'
    strategy:
      matrix:
        arch: [amd64, arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: oci-${{ matrix.arch }}
          path: oci
      - name: Install skopeo if the runner image lacks it
        run: command -v skopeo > /dev/null || { sudo apt-get update && sudo apt-get install -y --no-install-recommends skopeo; }

      - name: Log in to quay.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # --all keeps the image manifest and its provenance attestation. The per-architecture tags are
      # build intermediates, left in place after the merge: deploy by the signed index digest only.
      - name: Push the architecture image
        env:
          ARCH: ${{ matrix.arch }}
          QUAY_NS: ${{ vars.QUAY_NAMESPACE || 'meddleware-org' }}
          DOCKERHUB_NS: ${{ vars.DOCKERHUB_NAMESPACE || 'meddleware' }}
          SHA: ${{ github.sha }}
        run: |
          skopeo copy --all "oci-archive:oci/${ARCH}.tar" "docker://quay.io/${QUAY_NS}/${IMAGE}:${SHA}-${ARCH}"
          skopeo copy --all "oci-archive:oci/${ARCH}.tar" "docker://docker.io/${DOCKERHUB_NS}/${IMAGE}:${SHA}-${ARCH}"

  merge-docker-public:
    name: Merge + sign (quay.io + Docker Hub)
    needs: [version, publish-arch, sbom-crates]
    if: needs.version.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.merge.outputs.digest }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to quay.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute final tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            quay.io/${{ vars.QUAY_NAMESPACE || 'meddleware-org' }}/${{ env.IMAGE }}
            docker.io/${{ vars.DOCKERHUB_NAMESPACE || 'meddleware' }}/${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: |
            latest=auto

      # `imagetools create` over the two per-architecture indexes keeps their images and BuildKit provenance
      # attestations, adds no annotation, and is deterministic, so quay.io and Docker Hub get the same digest
      # (asserted below) that a cosign signature, the attestations and the consensus check are then tied to.
      - name: Merge multi-arch manifests
        id: merge
        env:
          QUAY_NS: ${{ vars.QUAY_NAMESPACE || 'meddleware-org' }}
          DOCKERHUB_NS: ${{ vars.DOCKERHUB_NAMESPACE || 'meddleware' }}
          SHA: ${{ github.sha }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          QUAY_SRC="quay.io/${QUAY_NS}/${IMAGE}:${SHA}"
          HUB_SRC="docker.io/${DOCKERHUB_NS}/${IMAGE}:${SHA}"

          QUAY_FLAGS=()
          HUB_FLAGS=()
          while IFS= read -r tag; do
            if [[ "$tag" == quay.io/* ]]; then
              QUAY_FLAGS+=(--tag "$tag")
            elif [[ "$tag" == docker.io/* ]]; then
              HUB_FLAGS+=(--tag "$tag")
            fi
          done <<< "${TAGS}"

          docker buildx imagetools create "${QUAY_FLAGS[@]}" "${QUAY_SRC}-amd64" "${QUAY_SRC}-arm64"
          docker buildx imagetools create "${HUB_FLAGS[@]}"   "${HUB_SRC}-amd64"  "${HUB_SRC}-arm64"

          # Resolve the merged manifest digest from the primary semver tag, on both registries.
          PRIMARY=$(awk '/^quay\.io\// && !/latest/ { print; exit }' <<< "${TAGS}")
          PRIMARY_HUB=$(awk '/^docker\.io\// && !/latest/ { print; exit }' <<< "${TAGS}")
          if [ -z "${PRIMARY}" ] || [ -z "${PRIMARY_HUB}" ]; then
            echo "::error::no release tag to resolve the digest from (not a release tag?)"
            exit 1
          fi
          DIGEST=$(docker buildx imagetools inspect "${PRIMARY}" --format '{{.Manifest.Digest}}')
          HUB_DIGEST=$(docker buildx imagetools inspect "${PRIMARY_HUB}" --format '{{.Manifest.Digest}}')
          if [ "${DIGEST}" != "${HUB_DIGEST}" ]; then
            echo "::error::quay.io (${DIGEST}) and Docker Hub (${HUB_DIGEST}) merged to different digests"
            exit 1
          fi
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          bash scripts/check-index.sh "quay.io/${QUAY_NS}/${IMAGE}@${DIGEST}"

      # Scan the merged image by digest BEFORE anything is signed or attested: a failing scan means
      # no signature, so consumers verifying signatures never accept a vulnerable image. The tags are
      # already pushed, so a failure needs a fixed rebuild (a new tag), not a re-run.
      - name: Scan the published image (fail on fixable CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: quay.io/${{ vars.QUAY_NAMESPACE || 'meddleware-org' }}/${{ env.IMAGE }}@${{ steps.merge.outputs.digest }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
          version: v0.74.0

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign images (keyless)
        env:
          DIGEST: ${{ steps.merge.outputs.digest }}
          QUAY_NS: ${{ vars.QUAY_NAMESPACE || 'meddleware-org' }}
          DOCKERHUB_NS: ${{ vars.DOCKERHUB_NAMESPACE || 'meddleware' }}
        run: |
          cosign sign --yes "quay.io/${QUAY_NS}/${IMAGE}@${DIGEST}"
          cosign sign --yes "docker.io/${DOCKERHUB_NS}/${IMAGE}@${DIGEST}"

      - name: Generate SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: quay.io/${{ vars.QUAY_NAMESPACE || 'meddleware-org' }}/${{ env.IMAGE }}@${{ steps.merge.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom-crates

      - name: Attest SBOMs (keyless)
        env:
          DIGEST: ${{ steps.merge.outputs.digest }}
          QUAY_NS: ${{ vars.QUAY_NAMESPACE || 'meddleware-org' }}
          DOCKERHUB_NS: ${{ vars.DOCKERHUB_NAMESPACE || 'meddleware' }}
        run: |
          for ref in "quay.io/${QUAY_NS}/${IMAGE}@${DIGEST}" "docker.io/${DOCKERHUB_NS}/${IMAGE}@${DIGEST}"; do
            cosign attest --yes --type spdxjson --predicate sbom.spdx.json "$ref"
            for bin in content-hub; do
              cosign attest --yes --type cyclonedx --predicate "sbom.${bin}.cdx.json" "$ref"
            done
          done

      - name: Attest build provenance (quay.io)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: quay.io/${{ vars.QUAY_NAMESPACE || 'meddleware-org' }}/${{ env.IMAGE }}
          subject-digest: ${{ steps.merge.outputs.digest }}
          push-to-registry: true

      - name: Attest build provenance (Docker Hub)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: docker.io/${{ vars.DOCKERHUB_NAMESPACE || 'meddleware' }}/${{ env.IMAGE }}
          subject-digest: ${{ steps.merge.outputs.digest }}
          push-to-registry: true

      - name: Summary
        run: |
          echo "Published & signed @ digest: ${{ steps.merge.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Verify: cosign verify --certificate-identity-regexp '^https://github.com/meddleware-org/content-hub-service/\\.github/workflows/docker-publish\\.yml@refs/tags/v' --certificate-oidc-issuer https://token.actions.githubusercontent.com <image>@<digest>" >> "$GITHUB_STEP_SUMMARY"

  # ── Dry run: the same merge and scan, against a throwaway registry on the runner ──
  # Proves, without a credential and without touching quay.io or Docker Hub, that the two native
  # builds merge into one index that keeps both images and both provenance attestations, carries the
  # labels, and passes the Trivy scan. Signing and attestation need Sigstore and are not exercised.
  merge-dry-run:
    name: Dry run (merge + scan in a local registry)
    needs: [version, build, sbom-crates]
    if: needs.version.outputs.dry_run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      registry:
        image: docker.io/library/registry:3@sha256:ddf754342cfc8acc51a56d5d0ab6af06826461864460636d8bd5c546dab2a7b8
        ports:
          - 5000:5000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: oci-*
          path: oci
      - name: Install skopeo if the runner image lacks it
        run: command -v skopeo > /dev/null || { sudo apt-get update && sudo apt-get install -y --no-install-recommends skopeo; }

      - name: Push the architecture images to the local registry
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            skopeo copy --all --dest-tls-verify=false "oci-archive:oci/oci-${arch}/${arch}.tar" "docker://localhost:5000/${IMAGE}:${SHA}-${arch}"
          done

      - name: Merge multi-arch manifests
        id: merge
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          SRC="localhost:5000/${IMAGE}:${SHA}"
          docker buildx imagetools create --tag "localhost:5000/${IMAGE}:dry-run" "${SRC}-amd64" "${SRC}-arm64"
          DIGEST=$(docker buildx imagetools inspect "localhost:5000/${IMAGE}:dry-run" --format '{{.Manifest.Digest}}')
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          bash scripts/check-index.sh "localhost:5000/${IMAGE}@${DIGEST}"
          for arch in amd64 arm64; do
            skopeo inspect --tls-verify=false --override-os linux --override-arch "${arch}" "docker://localhost:5000/${IMAGE}@${DIGEST}" \
              | jq -e --arg sha "${SHA}" '.Labels["org.opencontainers.image.title"] == "content-hub-service" and .Labels["org.opencontainers.image.revision"] == $sha and .Labels["org.opencontainers.image.version"] != null' > /dev/null \
              || { echo "::error::${arch} image is missing the expected OCI labels"; exit 1; }
          done

      - name: Scan the merged image (fail on fixable CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_NON_SSL: "true"
        with:
          image-ref: localhost:5000/${{ env.IMAGE }}@${{ steps.merge.outputs.digest }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
          version: v0.74.0

      - name: Summary
        run: |
          echo "Dry run OK, both architectures built natively and merged to ${{ steps.merge.outputs.digest }} (local registry, nothing published)" >> "$GITHUB_STEP_SUMMARY"

  # ── Self-hosted registry: promote the published image by digest (no rebuild) ──
  # quay.io, Docker Hub and the self-hosted registry must return the SAME digest for
  # <image>:<tag> (workspace docs/images/IMAGES.md, "Consensus"), so this job copies the image
  # that merge-docker-public pushed and signed instead of building it again. Best-effort: it fails
  # harmlessly until the PRIVATE_REGISTRY_* credentials exist.
  mirror-private:
    name: Mirror (self-hosted registry)
    runs-on: ubuntu-latest
    needs: [merge-docker-public]
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install oras
        uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4 # v2.0.2
        with:
          version: 1.3.4

      - name: Log in to self-hosted registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ vars.PRIVATE_REGISTRY || 'registry.meddleware.co.uk' }}
          username: ${{ secrets.PRIVATE_REGISTRY_USERNAME }}
          password: ${{ secrets.PRIVATE_REGISTRY_TOKEN }}

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ vars.PRIVATE_REGISTRY || 'registry.meddleware.co.uk' }}/${{ vars.PRIVATE_NAMESPACE || 'meddleware-org' }}/${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: |
            latest=auto

      - name: Copy the published image (same digest) and verify
        env:
          DIGEST: ${{ needs.merge-docker-public.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
          QUAY_NS: ${{ vars.QUAY_NAMESPACE || 'meddleware-org' }}
          PRIVATE_REGISTRY: ${{ vars.PRIVATE_REGISTRY || 'registry.meddleware.co.uk' }}
          PRIVATE_NAMESPACE: ${{ vars.PRIVATE_NAMESPACE || 'meddleware-org' }}
        run: |
          set -euo pipefail
          if ! [[ "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::the public job exported no valid image digest (got '${DIGEST}')"
            exit 1
          fi
          SRC="quay.io/${QUAY_NS}/${IMAGE}@${DIGEST}"
          COUNT=0
          while IFS= read -r dest; do
            [[ -n "${dest}" ]] || continue
            COUNT=$((COUNT + 1))
            # The published manifest is copied byte-for-byte, so the digest is unchanged;
            # `cosign copy` also carries the tag-based cosign artifacts (.sig/.att/.sbom).
            cosign copy --force "${SRC}" "${dest}"
            # cosign v3 stores signatures, SBOM attestations and build provenance as OCI
            # referrers, which `cosign copy` does not transfer: copy the referrers too.
            oras cp --recursive "${SRC}" "${dest}"
            GOT="$(docker buildx imagetools inspect "${dest}" --format '{{.Manifest.Digest}}')"
            if [[ "${GOT}" != "${DIGEST}" ]]; then
              echo "::error::${dest} resolves to ${GOT}, not the published ${DIGEST}"
              exit 1
            fi
            echo "${dest} -> ${GOT}"
          done <<< "${TAGS}"
          if (( COUNT == 0 )); then
            echo "::error::no tags to mirror (not a release tag?)"
            exit 1
          fi
          # The signature must verify on the mirror exactly as it does on quay.io.
          cosign verify \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp "^https://github\.com/${GITHUB_REPOSITORY}/\.github/workflows/docker-publish\.yml@refs/tags/v" \
            "${PRIVATE_REGISTRY}/${PRIVATE_NAMESPACE}/${IMAGE}@${DIGEST}" > /dev/null

      - name: Summary
        if: always()
        env:
          DIGEST: ${{ needs.merge-docker-public.outputs.digest }}
          PRIVATE_REGISTRY: ${{ vars.PRIVATE_REGISTRY || 'registry.meddleware.co.uk' }}
        run: |
          echo "Mirrored (no rebuild) @ digest ${DIGEST} to private registry @ ${PRIVATE_REGISTRY}" >> "$GITHUB_STEP_SUMMARY"
