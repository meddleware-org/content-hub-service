[package]
name = "content-hub"
description = "The content hub's one binary: admin, public, worker, migrate, seed and export-snapshot subcommands."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "content-hub"
path = "src/main.rs"

[dependencies]
content-hub-core = { workspace = true }
content-hub-store = { workspace = true }
content-hub-api = { workspace = true }
content-hub-publish = { workspace = true }
content-hub-worker = { workspace = true }
axum = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "net", "signal", "time", "macros", "sync"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
serde_json = { workspace = true }
serde-saphyr = { workspace = true }
getrandom = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
