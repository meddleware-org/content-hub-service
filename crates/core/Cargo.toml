# The content hub's pure logic: the data model's enumerations, the state machines, text rendering and counting, and
# the validation rules. Nothing in this crate does I/O, so every rule in it can be tested without a database or a
# network, and the other crates depend on it rather than the reverse.
[package]
# The crate name that the other crates and the binaries use.
name = "content-hub-core"
description = "Pure content-hub logic: the data model's enumerations, state machines and validation (no I/O)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# Inherited: the crate is never published to crates.io.
publish.workspace = true

# Lints, version, edition and licence are inherited from the workspace manifest, so every crate is held to one set of rules.
[lints]
workspace = true

# Pure: no async runtime, no network, no database. Rendering, counting and segmentation (C5) join here.
[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
unicode-segmentation = { workspace = true }
unicode-normalization = { workspace = true }
chrono = { workspace = true }
ring = { workspace = true }
sha2 = { workspace = true }
blake2 = { workspace = true }
base64 = { workspace = true }

# Test-only dependencies.
[dev-dependencies]
proptest = { workspace = true }
