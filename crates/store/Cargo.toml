[package]
name = "content-hub-store"
description = "PostgreSQL schema, migrations and every SQL statement of the content hub."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
content-hub-core = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true, features = ["rt", "time", "sync", "macros"] }
url = { workspace = true }
thiserror = { workspace = true }
serde_json = { workspace = true }
getrandom = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
serde = { workspace = true }
utoipa = { workspace = true }
base64 = { workspace = true }

[features]
# The per-test database harness (`testdb`), for this crate's tests and the other crates' dev builds.
# Adds no dependency; never enabled in a shipped build.
testing = []

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "sync"] }
