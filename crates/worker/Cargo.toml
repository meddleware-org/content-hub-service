# The publishing worker: claims queued instances, sends each at most once, and records every attempt. It also serves
# the metrics and health endpoints that the cluster probes and scrapes.
[package]
# The crate name that the other crates and the binaries use.
name = "content-hub-worker"
description = "The content hub's publishing worker: claims queued instances, sends them at most once, records every attempt."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# Inherited: the crate is never published to crates.io.
publish.workspace = true

# Lints, version, edition and licence are inherited from the workspace manifest, so every crate is held to one set of rules.
[lints]
workspace = true

# Runtime dependencies are versioned once, in the workspace manifest.
[dependencies]
content-hub-core = { workspace = true }
content-hub-store = { workspace = true }
content-hub-publish = { workspace = true }
content-hub-api = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true, features = ["rt", "time", "sync", "macros"] }
sqlx = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
getrandom = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }

# Test-only dependencies.
# Test-only: the database harness, the API crate's test signing key, and tower to call routers directly.
[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
content-hub-store = { workspace = true, features = ["testing"] }
content-hub-api = { workspace = true, features = ["testing"] }
tower = { workspace = true }
