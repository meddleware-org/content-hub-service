[package]
name = "content-hub-worker"
description = "The content hub's publishing worker: claims queued instances, sends them at most once, records every attempt."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
content-hub-core = { workspace = true }
content-hub-store = { workspace = true }
content-hub-publish = { workspace = true }
content-hub-api = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true, features = ["rt", "time", "sync", "macros"] }
sqlx = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
getrandom = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
content-hub-store = { workspace = true, features = ["testing"] }
content-hub-api = { workspace = true, features = ["testing"] }
tower = { workspace = true }
