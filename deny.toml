# cargo-deny policy for content-hub-service (run in CI by rust-ci.yml; locally: `cargo deny check`).

[graph]
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]

[advisories]
# RustSec advisories: vulnerable and yanked crates fail the build; unmaintained crates are reported
# for the whole graph so a replacement can be planned.
yanked = "deny"
unmaintained = "all"

[licenses]
# Permissive licences present in the dependency tree (2026-10-25). Adding a crate under any other
# licence fails CI until it is reviewed and listed here (and in about.toml).
allow = [
    "0BSD",
    "Apache-2.0",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
# Duplicate versions are common in the async ecosystem; report them without failing.
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies between the workspace's own crates are not wildcards.
allow-wildcard-paths = true

[sources]
# crates.io only: no git dependencies or alternative registries.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
